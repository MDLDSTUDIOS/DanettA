<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Ya no existe</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: radial-gradient(ellipse at center, #1a1a2e 0%, #0d0d17 70%, #000 100%);
    font-family: 'Segoe UI', Helvetica, Arial, sans-serif;
    overflow: hidden;
    position: relative;
  }

  .message {
    color: #f5f5f5;
    font-size: 1.6rem;
    text-align: center;
    padding: 0 20px;
    letter-spacing: 0.5px;
    text-shadow: 0 0 12px rgba(255,255,255,0.15);
    z-index: 2;
  }

  .crown-wrap {
    position: relative;
    margin-top: 50px;
    z-index: 2;
  }

  svg.crown {
    width: 160px;
    height: 160px;
    filter: drop-shadow(0 0 25px gold) drop-shadow(0 0 50px rgba(255,215,0,0.6));
    animation: float 3s ease-in-out infinite, shine 2.5s linear infinite;
  }

  @keyframes float {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-12px); }
  }

  @keyframes shine {
    0% { filter: drop-shadow(0 0 15px gold) drop-shadow(0 0 30px rgba(255,215,0,0.5)); }
    50% { filter: drop-shadow(0 0 35px #fff7cc) drop-shadow(0 0 70px rgba(255,215,0,0.9)); }
    100% { filter: drop-shadow(0 0 15px gold) drop-shadow(0 0 30px rgba(255,215,0,0.5)); }
  }

  .sparkle {
    position: absolute;
    width: 6px;
    height: 6px;
    background: #fff7cc;
    border-radius: 50%;
    opacity: 0;
    animation: sparkle 1.8s ease-in-out infinite;
  }

  @keyframes sparkle {
    0% { opacity: 0; transform: scale(0); }
    50% { opacity: 1; transform: scale(1.4); }
    100% { opacity: 0; transform: scale(0); }
  }
</style>
</head>
<body>

  <div class="message">Oh, parece que esto YA NO EXISTE...</div>

  <div class="crown-wrap">
    <svg class="crown" viewBox="0 0 100 80" xmlns="http://www.w3.org/2000/svg">
      <polygon points="10,75 90,75 90,68 10,68" fill="#FFD700"/>
      <polygon points="8,68 15,30 30,50 50,15 70,50 85,30 92,68"
               fill="url(#goldGrad)" stroke="#e6b800" stroke-width="1.5"/>
      <circle cx="15" cy="30" r="4" fill="#FFD700"/>
      <circle cx="50" cy="15" r="4" fill="#FFD700"/>
      <circle cx="85" cy="30" r="4" fill="#FFD700"/>
      <circle cx="30" cy="50" r="6" fill="#ff4d6d"/>
      <circle cx="50" cy="55" r="6" fill="#4dd2ff"/>
      <circle cx="70" cy="50" r="6" fill="#4dff88"/>
      <defs>
        <linearGradient id="goldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
          <stop offset="0%" stop-color="#fff7cc"/>
          <stop offset="50%" stop-color="#FFD700"/>
          <stop offset="100%" stop-color="#e6b800"/>
        </linearGradient>
      </defs>
    </svg>

    <div class="sparkle" style="top:-10px; left:20px; animation-delay:0s;"></div>
    <div class="sparkle" style="top:10px; left:140px; animation-delay:0.4s;"></div>
    <div class="sparkle" style="top:60px; left:-10px; animation-delay:0.8s;"></div>
    <div class="sparkle" style="top:80px; left:150px; animation-delay:1.2s;"></div>
    <div class="sparkle" style="top:30px; left:80px; animation-delay:1.6s;"></div>
  </div>

</body>
</html>
